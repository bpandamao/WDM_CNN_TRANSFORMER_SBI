[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wdmsbi"
version = "1.0.0"
description = "Amortized posterior estimation for LISA data with gaps: WDM images, a Transformer summarizer and flow matching"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "h5py", "jax", "equinox", "optax", "torch", "pywavelet"]

[project.optional-dependencies]
simulation = ["lisaanalysistools", "fastlisaresponse", "lisaglitch", "cupy"]

[tool.setuptools]
packages = ["wdmsbi"]
